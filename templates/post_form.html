{% extends "base.html" %}{% block title %}{{ 'Edit story' if post else 'Write a story' }}{% endblock %}{% block content %}
<section class="editor-wrap"><p class="eyebrow">YOUR SPACE TO CREATE</p><h1>{{ 'Refine your story.' if post else 'Every story starts somewhere.' }}</h1><form class="editor-card" method="post"><label>Story title<input name="title" maxlength="160" required value="{{ post.title if post else '' }}" placeholder="Give your story a title"></label><label>Your story<textarea name="body" rows="14" required placeholder="Start writing…">{{ post.body if post else '' }}</textarea></label><div class="editor-actions"><a class="text-link" href="{{ url_for('view_post', post_id=post.id) if post else url_for('index') }}">Cancel</a><button class="button primary">{{ 'Save changes' if post else 'Publish story' }} ↗</button></div></form></section>
{% endblock %}
