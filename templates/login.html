{% extends "base.html" %}{% block title %}Sign in{% endblock %}{% block content %}
<section class="auth-wrap"><div class="auth-intro"><p class="eyebrow">WELCOME BACK</p><h1>Your next idea<br><em>starts here.</em></h1><p>Sign in to publish stories and join the conversation.</p></div>
<form class="form-card" method="post"><h2>Sign in</h2><label>Username or email<input name="identity" required autocomplete="username" placeholder="Your username or email"></label><label>Password<input type="password" name="password" required autocomplete="current-password" placeholder="Your password"></label><button class="button primary full">Sign in</button><p class="form-foot">New to Inkwell? <a href="{{ url_for('register') }}">Create an account</a></p></form></section>
{% endblock %}
